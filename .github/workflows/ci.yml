name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: 執行單元測試與產生報告
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write # 必須允許 checks 寫入權限，用來建立測試報告 check runs

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 安裝 Bun 環境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: 安裝 Monorepo 依賴套件
        run: bun install --frozen-lockfile

      - name: 重新產生 Prisma Client
        run: bun --cwd apps/api prisma generate

      - name: 執行 Jest 單元測試 (產生 JUnit XML)
        working-directory: apps/api
        run: bun run test -- --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: '.'
          JEST_JUNIT_OUTPUT_NAME: 'junit.xml'
        # 即使測試失敗也繼續，以便下一階段發布完整報告
        continue-on-error: true

      - name: 發布測試報告至 GitHub Action UI
        uses: dorny/test-reporter@v1
        with:
          name: NestJS API 單元測試報告
          path: apps/api/junit.xml
          reporter: jest-junit
          fail-on-error: true # 若有任何測試失敗，此 Step 也會判定為失敗，確保 CI 正常擋下錯誤

      - name: 執行 Web 純邏輯單元測試 (Tier 1)
        working-directory: apps/web
        run: bun test src

  test-e2e:
    name: 執行端對端合約測試 (Playwright Tier 3)
    runs-on: ubuntu-latest
    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 安裝 Bun 環境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: 安裝 Monorepo 依賴套件
        run: bun install --frozen-lockfile

      - name: 啟動測試用 PostgreSQL 與 Redis 服務
        run: |
          docker compose -f docker-compose.dev.yml up -d db redis
          echo "等待 PostgreSQL 與 Redis 就緒..."
          until docker compose -f docker-compose.dev.yml exec -T db pg_isready -U dev_user -d app_dev; do sleep 1; done
          until docker compose -f docker-compose.dev.yml exec -T redis redis-cli ping | grep PONG; do sleep 1; done

      - name: 資料庫遷移與初始化 Seed 資料
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/app_dev?schema=public
          ADMIN_EMAIL_1: admin001@example.com
          ADMIN_PASSWORD_1: "000000"
          ADMIN_NICKNAME_1: admin001
        run: |
          bunx prisma generate
          bunx prisma migrate deploy
          bun run prisma/seed.ts

      - name: 執行 API E2E 測試
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/app_dev?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: dev-jwt-secret-for-ci-at-least-32chars-long
          JWT_REFRESH_SECRET: dev-jwt-refresh-secret-for-ci-at-least-32chars-long
        run: bun run test:e2e

      - name: 背景啟動 NestJS API 服務
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://dev_user:dev_password@localhost:5432/app_dev?schema=public
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          PORT: 3000
          FRONTEND_URL: http://localhost:3001
          JWT_SECRET: dev-jwt-secret-for-ci-at-least-32chars-long
          JWT_REFRESH_SECRET: dev-jwt-refresh-secret-for-ci-at-least-32chars-long
        run: |
          bun run start:dev &
          echo "等待 NestJS API (http://localhost:3000/) 就緒..."
          for i in {1..30}; do
            if curl -s http://localhost:3000/ | grep -q "API 連線正常"; then
              echo "NestJS API 服務已就緒！"
              break
            fi
            sleep 2
          done

      - name: 安裝 Playwright 瀏覽器核心 (Chromium)
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: 執行 Web Playwright E2E 合約測試
        working-directory: apps/web
        env:
          PORT: 3001
          API_URL: http://localhost:3000/api
          CI: true
        run: bun run test:e2e

      - name: 上傳 Playwright 測試報告 (僅失敗或需追蹤時)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  deploy:
    name: 建置 Docker 映像檔並部署至 AWS EC2
    needs: [test, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 QEMU 模擬器
        uses: docker/setup-qemu-action@v3

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 設定 AWS 認證憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 登入 Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 建置並推送 NestJS API 映像檔
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-api:latest
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-api:${{ github.sha }}

      - name: 建置並推送 Next.js Web 映像檔
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile.prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-web:latest
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-web:${{ github.sha }}

      - name: 取得 GitHub Runner 公網 IP
        run: |
          for i in {1..3}; do
            ip=$(curl -s --connect-timeout 5 https://checkip.amazonaws.com || curl -s --connect-timeout 5 https://ifconfig.me || curl -s --connect-timeout 5 https://api.ipify.org)
            ip=$(echo "$ip" | tr -d '\r' | tr -d '\n' | tr -d ' ')
            if [[ $ip =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "RUNNER_IP=$ip" >> $GITHUB_ENV
              echo "成功取得 IP: $ip"
              exit 0
            fi
            echo "取得 IP 失敗，2 秒後重試..."
            sleep 2
          done
          echo "無法取得有效的公網 IP"
          exit 1

      - name: 臨時允許 Runner IP 透過 SSH 連線 (Port 22)
        run: |
          echo "正在授權 IP: ${{ env.RUNNER_IP }}"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32

      - name: 建立與配置生產環境 .env 檔案
        env:
          ALL_SECRETS: ${{ toJson(secrets) }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          node -e '
            const fs = require("fs");
            const secrets = JSON.parse(process.env.ALL_SECRETS || "{}");
            
            // 基礎非敏感系統預設配置 (可被 GitHub Secrets 覆蓋)
            const baseConfig = {
              APP_NAME: "crypto-sniper-v2",
              PROJECT_NAME: "crypto-sniper-v2",
              PORT: "3000",
              APP_PORT: "3000",
              ENABLE_CORS: "false",
              FRONTEND_URL: "http://localhost:3001",
              LOG_ALL_REQUESTS: "false",
              REDIS_HOST: "redis",
              REDIS_PORT: "6379"
            };

            // 合併 baseConfig 與 GitHub Secrets
            const mergedEnv = { ...baseConfig, ...secrets };

            // 動態生成部署專用變數
            if (mergedEnv.POSTGRES_USER && mergedEnv.POSTGRES_PASSWORD && mergedEnv.POSTGRES_DB) {
              mergedEnv.DATABASE_URL = `postgresql://${mergedEnv.POSTGRES_USER}:${mergedEnv.POSTGRES_PASSWORD}@db:5432/${mergedEnv.POSTGRES_DB}?schema=public`;
            }
            if (process.env.REGISTRY) {
              mergedEnv.API_IMAGE = `${process.env.REGISTRY}/cryptosniper-api:latest`;
              mergedEnv.WEB_IMAGE = `${process.env.REGISTRY}/cryptosniper-web:latest`;
            }

            // 排除基礎設施與部署無關的 Secrets
            const excludeKeys = [
              "AWS_ACCESS_KEY_ID",
              "AWS_SECRET_ACCESS_KEY",
              "AWS_REGION",
              "AWS_SG_ID",
              "EC2_HOST",
              "EC2_USERNAME",
              "EC2_SSH_KEY",
              "CF_ORIGIN_CERT",
              "CF_ORIGIN_KEY",
              "github_token"
            ];

            let envOutput = "";
            for (const [key, value] of Object.entries(mergedEnv)) {
              if (excludeKeys.includes(key)) continue;
              if (value !== undefined && value !== null && value !== "") {
                envOutput += `${key}=${value}\n`;
              }
            }
            fs.writeFileSync(".env", envOutput.trim() + "\n");
          '

      - name: 建立 Traefik SSL 憑證與動態設定
        env:
          CF_ORIGIN_CERT: ${{ secrets.CF_ORIGIN_CERT }}
          CF_ORIGIN_KEY: ${{ secrets.CF_ORIGIN_KEY }}
        run: |
          mkdir -p traefik/dynamic traefik/certs
          if [ -n "$CF_ORIGIN_CERT" ] && [ -n "$CF_ORIGIN_KEY" ]; then
            echo "$CF_ORIGIN_CERT" > traefik/certs/cert.pem
            echo "$CF_ORIGIN_KEY" > traefik/certs/key.pem
            cat << 'EOF' > traefik/dynamic/tls.yml
          tls:
            stores:
              default:
                defaultCertificate:
                  certFile: /etc/traefik/certs/cert.pem
                  keyFile: /etc/traefik/certs/key.pem
          EOF
            echo "成功生成 Cloudflare 源站憑證與 TLS 動態設定。"
          else
            echo "未設定 CF_ORIGIN_CERT 或 CF_ORIGIN_KEY，將使用 Traefik 預設自簽憑證。"
          fi

      - name: 複製部署與設定檔至 EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,prometheus/prometheus.yml,.env,traefik'
          target: "/home/${{ secrets.EC2_USERNAME }}/${{ secrets.PROJECT_NAME || 'crypto-sniper-v2' }}/"

      - name: 取得 ECR 登入密碼 (Token)
        id: ecr-token
        run: |
          token=$(aws ecr get-login-password --region ${{ secrets.AWS_REGION }})
          echo "::add-mask::$token"
          echo "ECR_PASSWORD=$token" >> $GITHUB_ENV

      - name: 透過 SSH 部署至 AWS EC2 生產伺服器
        uses: appleboy/ssh-action@v1.0.3
        env:
          ECR_PASSWORD: ${{ env.ECR_PASSWORD }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          envs: ECR_PASSWORD
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/${{ secrets.PROJECT_NAME || 'crypto-sniper-v2' }}
            # 檢查並自動建立 traefik-public 外部網路 (供 Traefik 路由使用)
            docker network inspect traefik-public >/dev/null 2>&1 || docker network create traefik-public
            # 登入 AWS ECR 以便拉取映像檔 (直接使用 Runner 傳遞的 Token，免於在 EC2 安裝 AWS CLI)
            echo "$ECR_PASSWORD" | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            # 拉取最新映像檔
            docker compose -f docker-compose.prod.yml pull
            # 啟動/更新服務 (需先啟動，後續 exec 才能在運行中的容器內執行)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # 等待資料庫健康檢查通過
            echo '等待資料庫就緒...'
            docker compose -f docker-compose.prod.yml exec -T db sh -c 'until pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done'
            # 執行資料庫遷移
            docker compose -f docker-compose.prod.yml exec -T app bunx prisma migrate deploy
            # 清理過期/無用的 Docker 資源
            docker image prune -f

      - name: 撤銷 Runner IP 的 SSH 連線權限
        if: always() && env.RUNNER_IP != ''
        run: |
          echo "正在撤銷 IP: ${{ env.RUNNER_IP }}"
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32
