name: CI/CD Pipeline

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: 執行單元測試與產生報告
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      checks: write # 必須允許 checks 寫入權限，用來建立測試報告 check runs

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 安裝 Bun 環境
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3

      - name: 安裝 Monorepo 依賴套件
        run: bun install --frozen-lockfile

      - name: 重新產生 Prisma Client
        run: bun --cwd apps/api prisma generate

      - name: 執行 Jest 單元測試 (產生 JUnit XML)
        working-directory: apps/api
        run: bun run test -- --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: '.'
          JEST_JUNIT_OUTPUT_NAME: 'junit.xml'
        # 即使測試失敗也繼續，以便下一階段發布完整報告
        continue-on-error: true

      - name: 發布測試報告至 GitHub Action UI
        uses: dorny/test-reporter@v1
        with:
          name: NestJS API 單元測試報告
          path: apps/api/junit.xml
          reporter: jest-junit
          fail-on-error: true # 若有任何測試失敗，此 Step 也會判定為失敗，確保 CI 正常擋下錯誤

  deploy:
    name: 建置 Docker 映像檔並部署至 AWS EC2
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: 檢出專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 設定 AWS 認證憑證
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 登入 Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 建置並推送 NestJS API 映像檔
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-api:latest
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-api:${{ github.sha }}

      - name: 建置並推送 Next.js Web 映像檔
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-web:latest
            ${{ steps.login-ecr.outputs.registry }}/cryptosniper-web:${{ github.sha }}

      - name: 取得 GitHub Runner 公網 IP
        run: |
          for i in {1..3}; do
            ip=$(curl -s --connect-timeout 5 https://checkip.amazonaws.com || curl -s --connect-timeout 5 https://ifconfig.me || curl -s --connect-timeout 5 https://api.ipify.org)
            ip=$(echo "$ip" | tr -d '\r' | tr -d '\n' | tr -d ' ')
            if [[ $ip =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "RUNNER_IP=$ip" >> $GITHUB_ENV
              echo "成功取得 IP: $ip"
              exit 0
            fi
            echo "取得 IP 失敗，2 秒後重試..."
            sleep 2
          done
          echo "無法取得有效的公網 IP"
          exit 1

      - name: 臨時允許 Runner IP 透過 SSH 連線 (Port 22)
        run: |
          echo "正在授權 IP: ${{ env.RUNNER_IP }}"
          aws ec2 authorize-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32

      - name: 建立與配置生產環境 .env 檔案
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          APP_DOMAIN: ${{ secrets.APP_DOMAIN }}
          ROOT_DOMAIN: ${{ secrets.ROOT_DOMAIN }}
          API_DOMAIN: ${{ secrets.API_DOMAIN }}
          MONITOR_DOMAIN: ${{ secrets.MONITOR_DOMAIN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          node -e '
            const fs = require("fs");
            let env = fs.readFileSync(".env.example", "utf8");
            
            const secrets = {
              POSTGRES_USER: process.env.POSTGRES_USER,
              POSTGRES_PASSWORD: process.env.POSTGRES_PASSWORD,
              POSTGRES_DB: process.env.POSTGRES_DB,
              DATABASE_URL: process.env.POSTGRES_USER && process.env.POSTGRES_PASSWORD && process.env.POSTGRES_DB
                ? `postgresql://${process.env.POSTGRES_USER}:${process.env.POSTGRES_PASSWORD}@db:5432/${process.env.POSTGRES_DB}?schema=public`
                : "",
              JWT_SECRET: process.env.JWT_SECRET,
              JWT_REFRESH_SECRET: process.env.JWT_REFRESH_SECRET,
              API_IMAGE: process.env.REGISTRY ? `${process.env.REGISTRY}/cryptosniper-api:latest` : "",
              WEB_IMAGE: process.env.REGISTRY ? `${process.env.REGISTRY}/cryptosniper-web:latest` : "",
              APP_DOMAIN: process.env.APP_DOMAIN,
              ROOT_DOMAIN: process.env.ROOT_DOMAIN,
              API_DOMAIN: process.env.API_DOMAIN,
              MONITOR_DOMAIN: process.env.MONITOR_DOMAIN,
              TELEGRAM_BOT_TOKEN: process.env.TELEGRAM_BOT_TOKEN,
              GOOGLE_CLIENT_ID: process.env.GOOGLE_CLIENT_ID,
              GOOGLE_CLIENT_SECRET: process.env.GOOGLE_CLIENT_SECRET,
              DISCORD_CLIENT_ID: process.env.DISCORD_CLIENT_ID,
              DISCORD_CLIENT_SECRET: process.env.DISCORD_CLIENT_SECRET,
            };

            for (const [key, value] of Object.entries(secrets)) {
              if (value) {
                const regex = new RegExp(`^#?\\s*${key}=.*`, "m");
                if (regex.test(env)) {
                  env = env.replace(regex, `${key}=${value}`);
                } else {
                  env += `\n${key}=${value}`;
                }
              }
            }
            fs.writeFileSync(".env", env);
          '

      - name: 複製部署與設定檔至 EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'docker-compose.prod.yml,prometheus/prometheus.yml,.env'
          target: '/home/${{ secrets.EC2_USERNAME }}/crypto-sniper-v2/'

      - name: 透過 SSH 部署至 AWS EC2 生產伺服器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/${{ secrets.EC2_USERNAME }}/crypto-sniper-v2
            # 登入 AWS ECR 以便拉取映像檔
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.login-ecr.outputs.registry }}
            # 拉取最新映像檔
            docker compose -f docker-compose.prod.yml pull
            # 啟動/更新服務 (需先啟動，後續 exec 才能在運行中的容器內執行)
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            # 等待資料庫健康檢查通過
            echo '等待資料庫就緒...'
            docker compose -f docker-compose.prod.yml exec -T db sh -c 'until pg_isready -U $POSTGRES_USER -d $POSTGRES_DB; do sleep 2; done'
            # 執行資料庫遷移
            docker compose -f docker-compose.prod.yml exec -T app bunx prisma migrate deploy
            # 清理過期/無用的 Docker 資源
            docker image prune -f

      - name: 撤銷 Runner IP 的 SSH 連線權限
        if: always() && env.RUNNER_IP != ''
        run: |
          echo "正在撤銷 IP: ${{ env.RUNNER_IP }}"
          aws ec2 revoke-security-group-ingress \
            --group-id ${{ secrets.AWS_SG_ID }} \
            --protocol tcp \
            --port 22 \
            --cidr ${{ env.RUNNER_IP }}/32
