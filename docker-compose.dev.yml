name: ${PROJECT_NAME:-app}-dev

services:
  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-app}-db-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dev_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-app_dev}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - app-network-dev
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dev_user} -d ${POSTGRES_DB:-app_dev}']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-app}-redis-dev
    ports:
      - '${REDIS_PORT:-6379}:6379'
    networks:
      - app-network-dev
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256M

  app:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.dev
    container_name: ${PROJECT_NAME:-app}-api-dev
    ports:
      - '${APP_PORT:-3000}:3000'
      - '${DEBUG_PORT:-9229}:9229' # Debug port
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dev_user}:${POSTGRES_PASSWORD:-dev_password}@db:5432/${POSTGRES_DB:-app_dev}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./apps/api:/app
      - node_modules_api_dev:/app/node_modules
    networks:
      - app-network-dev
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: ${PROJECT_NAME:-app}-web-dev
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3001
      - API_URL=http://app:3000/api/v1
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:3001/']
      interval: 15s
      timeout: 5s
      retries: 3
    volumes:
      - .:/app
      - node_modules_web_dev:/app/node_modules
    networks:
      - app-network-dev
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres_data_dev:
    name: ${PROJECT_NAME:-app}_postgres_data_dev
  node_modules_api_dev:
    name: ${PROJECT_NAME:-app}_node_modules_api_dev
  node_modules_web_dev:
    name: ${PROJECT_NAME:-app}_node_modules_web_dev

networks:
  app-network-dev:
    name: ${PROJECT_NAME:-app}_network_dev
    driver: bridge
