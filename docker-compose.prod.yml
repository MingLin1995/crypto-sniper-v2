name: ${PROJECT_NAME:-app}-prod

services:
  traefik:
    image: traefik:v3.6
    container_name: ${PROJECT_NAME:-app}-traefik-prod
    restart: unless-stopped
    environment:
      - DOCKER_API_VERSION=1.46
    command:
      - '--api.dashboard=false'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--providers.docker.network=traefik-public'
      - '--providers.file.directory=/etc/traefik/dynamic'
      - '--providers.file.watch=true'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.websecure.address=:443'
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - ./traefik/certs:/etc/traefik/certs:ro
    networks:
      - traefik-public
      - app-network-prod
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 48M

  db:
    image: postgres:16-alpine
    container_name: ${PROJECT_NAME:-app}-db-prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network-prod
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 128M

  redis:
    image: redis:7-alpine
    container_name: ${PROJECT_NAME:-app}-redis-prod
    restart: unless-stopped
    networks:
      - app-network-prod
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    command: redis-server --maxmemory 28mb --maxmemory-policy volatile-lru
    deploy:
      resources:
        limits:
          memory: 40M

  app:
    image: ${API_IMAGE}
    container_name: ${PROJECT_NAME:-app}-api-prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network-prod
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT_NAME}-api-http.rule=Host(`${API_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-api-http.entrypoints=web'
      - 'traefik.http.routers.${PROJECT_NAME}-api.rule=Host(`${API_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-api.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT_NAME}-api.tls=true'
      - 'traefik.http.services.${PROJECT_NAME}-api.loadbalancer.server.port=3000'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:3000/']
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 220M

  web:
    image: ${WEB_IMAGE}
    container_name: ${PROJECT_NAME:-app}-web-prod
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - API_URL=http://app:3000/api
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network-prod
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT_NAME}-web-http.rule=Host(`${APP_DOMAIN}`) || Host(`${ROOT_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-web-http.entrypoints=web'
      - 'traefik.http.routers.${PROJECT_NAME}-web.rule=Host(`${APP_DOMAIN}`) || Host(`${ROOT_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-web.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT_NAME}-web.tls=true'
      - 'traefik.http.services.${PROJECT_NAME}-web.loadbalancer.server.port=3001'
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--spider', 'http://localhost:3001/']
      interval: 15s
      timeout: 5s
      retries: 3
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 110M

  prometheus:
    image: prom/prometheus:latest
    container_name: ${PROJECT_NAME:-app}-prometheus-prod
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=1GB'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks:
      - app-network-prod
    deploy:
      resources:
        limits:
          memory: 64M

  grafana:
    image: grafana/grafana:latest
    container_name: ${PROJECT_NAME:-app}-grafana-prod
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network-prod
      - traefik-public
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.${PROJECT_NAME}-grafana-http.rule=Host(`${MONITOR_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-grafana-http.entrypoints=web'
      - 'traefik.http.routers.${PROJECT_NAME}-grafana.rule=Host(`${MONITOR_DOMAIN}`)'
      - 'traefik.http.routers.${PROJECT_NAME}-grafana.entrypoints=websecure'
      - 'traefik.http.routers.${PROJECT_NAME}-grafana.tls=true'
      - 'traefik.http.services.${PROJECT_NAME}-grafana.loadbalancer.server.port=3000'
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 280M

volumes:
  postgres_data_prod:
    name: ${PROJECT_NAME:-app}_postgres_data_prod
  prometheus_data:
    name: ${PROJECT_NAME:-app}_prometheus_data
  grafana_data:
    name: ${PROJECT_NAME:-app}_grafana_data

networks:
  app-network-prod:
    name: ${PROJECT_NAME:-app}_network_prod
    driver: bridge
  traefik-public:
    external: true
